[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scaler"
version = "0.1.0"
description = "Single-host Docker orchestrator that reconciles desired vs actual replicas."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "websockets==17.1",
    "docker==7.2.0",
    "redis==8.1.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.3",
    "APScheduler==3.11.3",
    "prometheus-client==0.26.0",
    "structlog==26.1.0",
    "aiomqtt==2.4.0",
    "zeroconf==0.148.0",
]

[project.scripts]
scaler = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
