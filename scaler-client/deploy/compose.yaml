name: scaler

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      PING: 1
      VERSION: 1
      EVENTS: 1
      IMAGES: 0
      EXEC: 0
      SECRETS: 0
      CONFIGS: 0
      SWARM: 0
      VOLUMES: 0
      NETWORKS: 0
      BUILD: 0
      AUTH: 0
      COMMIT: 0
      PLUGINS: 0
      SYSTEM: 0
      DISTRIBUTION: 0
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"
    restart: unless-stopped
    networks:
      - scaler

  redis:
    image: redis:7.4-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - scaler

  traefik:
    image: traefik:v3.7
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=scaler
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - scaler

  # Workload images only. The host-side orchestrator creates/stops replicas.
  # Profile keeps these from running as compose services; IMAGES=0 on the
  # proxy means each image must be built locally before the orchestrator starts.
  demo:
    build: ../workloads/demo
    image: scaler-demo:latest
    profiles:
      - build

  alpha:
    build: ../workloads/alpha
    image: scaler-alpha:latest
    profiles:
      - build

  beta:
    build: ../workloads/beta
    image: scaler-beta:latest
    profiles:
      - build

networks:
  scaler:
    name: scaler
